name: Deploy Frontend - Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RESOURCE_GROUP: "Convitsa-Development"
  APP_NAME: "convitsa-frontend-dev"
  ENVIRONMENT: "development"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun --version

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Bun Install
        run: |
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun install

      - name: Bun Build
        run: |
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun run build

      - name: Create .env file
        run: |
          echo "Creating .env file..."
          > .env
          for key in $(echo '${{ toJSON(secrets) }}' | jq -r 'keys[]'); do
            value=$(echo '${{ toJSON(secrets) }}' | jq -r --arg k "$key" '.[$k]')
            if [ "$value" != "null" ]; then
              echo "$key=$value" >> .env
            fi
          done
          for key in $(echo '${{ toJSON(vars) }}' | jq -r 'keys[]'); do
            value=$(echo '${{ toJSON(vars) }}' | jq -r --arg k "$key" '.[$k]')
            if [ "$value" != "null" ]; then
              echo "$key=$value" >> .env
            fi
          done
          cat .env

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: .
          # Include .next folder and Bun cache in deployment
          include: |
            .next
            node_modules
            .bun
